---
# RustFS Helm values - replaces MinIO as the S3-compatible object store
# Chart: rustfs/rustfs from https://charts.rustfs.com/
#
# NOTE: Bucket and user provisioning is NOT handled here.
#       It is managed by a separate Kubernetes Job defined in rustfs-provisioning-job.yaml.
#
# IMPORTANT: Several upstream chart defaults changed in chart 0.8.0 (appVersion 1.0.0-beta.8).
# The explicit overrides below are REQUIRED to maintain correct standalone behaviour:
#
#   - ingress.enabled: upstream default flipped from false → TRUE. The explicit
#     'enabled: false' below is essential; removing it would accidentally expose
#     an ingress endpoint (default host: example.rustfs.com).
#
#   - mode.standalone / mode.distributed: upstream default flipped to distributed=true.
#     The explicit standalone=true / distributed=false below is required for Kind clusters.
#
#   - storageclass.name: upstream default changed from 'standard' to 'local-path'.
#     The explicit 'standard' below is correct for Kind clusters.
#
#   - secret.rustfs credentials: the chart now enforces a security guard that rejects
#     empty or default ('rustfsadmin') credentials unless secret.allowInsecureDefaults=true.
#     The non-default values below satisfy this guard as-is.

image:
  rustfs:
    repository: rustfs/rustfs
    tag: latest
    pullPolicy: IfNotPresent

secret:
  rustfs:
    access_key: root
    secret_key: "I,@m,R00t;"

# Standalone mode: one pod, one PVC
mode:
  standalone:
    enabled: true
  distributed:
    enabled: false

storageclass:
  name: standard  # 'standard' works for Kind clusters; change to match your StorageClass if needed
  dataStorageSize: 20Gi
  logStorageSize: 1Gi

resources:
  requests:
    memory: 512Mi

# Ingress is not needed; RustFS is accessed internally by LGTM components
ingress:
  enabled: false
