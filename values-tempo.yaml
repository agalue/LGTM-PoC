# Warning: there won't be any resource requests/limits for any Tempo-related container
---
serviceAccount: # There is no way to set an account per component
  create: true
  name: tempo-sa

search:
  enabled: true

tempo:
  structuredConfig:
    usage_report:
      reporting_enabled: false
  memberlist:
    appProtocol: tcp

multitenancyEnabled: true

# Tempo 3.0 replaced the ingester/compactor write path with a Kafka-backed
# pipeline (distributor -> Kafka -> block-builder/live-store). The compactor
# component is gone; block retention now lives under backendScheduler.
backendScheduler:
  config:
    provider:
      compaction:
        compaction:
          # Increased from 48h to 7 days to match Loki/Mimir retention
          block_retention: 168h # Global Traces TTL (7 days)

# Points Tempo at the shared single-node Redpanda broker (Kafka-API-compatible)
# deployed via values-redpanda.yaml in the "kafka" namespace (also used by Mimir).
ingest:
  kafka:
    address: redpanda.kafka.svc.cluster.local:9093
    topic: tempo-traces
    auto_create_topic_enabled: true
    # Single-partition topic to match the single-broker, single-replica
    # block-builder/live-store setup below (keeps this PoC lightweight).
    auto_create_topic_default_partitions: 1

blockBuilder:
  replicas: 1
  # block-builder doesn't expose a gRPC port via its Service, but the shared
  # Tempo binary still opens the internal gRPC server (ring/health checks) on
  # this port. Unlike distributor/querier/queryFrontend/metricsGenerator,
  # this component has no "appProtocol" value in the chart, so the port-name
  # convention is used instead: naming it "tcp-<x>" makes Istio's sidecar
  # treat it as raw TCP passthrough (avoids HTTP/2 sniffing issues) in sidecar
  # mode, and is a no-op in ambient mode (no waypoint = pure L4 passthrough
  # already). This works regardless of Istio mode without needing appProtocol.
  extraPorts:
  - name: tcp-grpc
    containerPort: 9095
    protocol: TCP
  # Consumes from Kafka; wait for the broker/topic to be reachable before
  # starting, same pattern used for Mimir's Kafka-dependent components.
  initContainers:
  - name: wait-kafka
    image: confluentinc/cp-kcat:8.1.0
    command:
      [
        "sh", "-c",
        "
        trap 'echo Received SIGTERM; exit 0' TERM INT;
        while true; do
          kcat -b redpanda.kafka.svc.cluster.local:9093 -L >/dev/null 2>&1 && exit 0;
          echo 'waiting for kafka...';
          sleep 2;
        done
        "
      ]

liveStore:
  replicas: 1
  # Same rationale as blockBuilder.extraPorts above: live-store serves
  # recent-trace queries over the internal gRPC port, which also has no
  # "appProtocol" value exposed by the chart.
  extraPorts:
  - name: tcp-grpc
    containerPort: 9095
    protocol: TCP
  # Consumes from Kafka; same rationale as blockBuilder.initContainers above.
  initContainers:
  - name: wait-kafka
    image: confluentinc/cp-kcat:8.1.0
    command:
      [
        "sh", "-c",
        "
        trap 'echo Received SIGTERM; exit 0' TERM INT;
        while true; do
          kcat -b redpanda.kafka.svc.cluster.local:9093 -L >/dev/null 2>&1 && exit 0;
          echo 'waiting for kafka...';
          sleep 2;
        done
        "
      ]

traces:
  otlp:
    grpc:
      enabled: true
    http:
      enabled: true

# Updated metrics generator configuration using overrides instead of global_overrides
# This provides better per-tenant control
overrides:
  defaults:
    metrics_generator:
      processors:
      - service-graphs
      - span-metrics
      # Optional: local-blocks processor for additional metrics
      # - local-blocks

gateway:
  enabled: false

memberlist:
  rejoin_interval: 60s
  dead_node_reclaim_time: 60s

distributor:
  replicas: 2
  appProtocol:
    grpc: tcp
  # Produces to Kafka; wait for the broker to be reachable before starting,
  # same pattern used for Mimir's Kafka-dependent components.
  initContainers:
  - name: wait-kafka
    image: confluentinc/cp-kcat:8.1.0
    command:
      [
        "sh", "-c",
        "
        trap 'echo Received SIGTERM; exit 0' TERM INT;
        while true; do
          kcat -b redpanda.kafka.svc.cluster.local:9093 -L >/dev/null 2>&1 && exit 0;
          echo 'waiting for kafka...';
          sleep 2;
        done
        "
      ]

queryFrontend:
  replicas: 2
  appProtocol:
    grpc: tcp
  config:
    search:
      # The following are defaults but show how to control where to query
      query_backend_after: 15m
      query_ingesters_until: 30m
      # Add max_duration to prevent expensive queries
      max_duration: 168h  # 7 days max search window
    # Add query timeout configuration
    query_timeout: 5m

querier:
  replicas: 3
  appProtocol:
    grpc: tcp
  config:
    # Add max concurrent queries per tenant
    max_concurrent_queries: 20

metricsGenerator:
  enabled: true
  replicas: 2
  appProtocol:
    grpc: tcp
  config:
    processor:
      service_graphs:
        dimensions:
        - user
        # Add histogram buckets for latency metrics
        histogram_buckets: [0.1, 0.2, 0.4, 0.8, 1.6, 3.2, 6.4, 12.8]
      span_metrics:
        dimensions:
        - user
        intrinsic_dimensions:
          span_name: false
          status_message: false
        # Add histogram buckets for duration metrics
        histogram_buckets: [0.002, 0.004, 0.008, 0.016, 0.032, 0.064, 0.128, 0.256, 0.512, 1.024, 2.048, 4.096, 8.192, 16.384]
    storage:
      remote_write:
      - url: http://mimir-distributor.mimir.svc:8080/api/v1/push
        send_exemplars: true
        headers:
          X-Scope-OrgID: _local
        # Add queue configuration for better reliability
        queue_config:
          capacity: 10000
          max_shards: 50
          min_shards: 1
          max_samples_per_send: 5000
          batch_send_deadline: 5s

memcached:
  replicas: 2
  extraArgs:
  - -m 256 # To avoid the default of 64 (megabytes)
  resources: # Memory must be greater than `-m`
    requests:
      memory: 284Mi
    limits:
      memory: 284Mi

storage:
  trace:
    backend: s3
    s3:
      endpoint: rustfs-svc.storage.svc:9000
      bucket: tempo-data
      access_key: remote_user
      secret_key: R3m0t3us3r
      insecure: true
      forcepathstyle: true

metaMonitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: monitor
  dashboards:
    enabled: true
    labels:
      release: monitor
  prometheusRule:
    enabled: true
    labels:
      release: monitor
