# Warning: there won't be any resource requests/limits for any Loki-related container
---
no_resources: &no_resources
  requests:
    cpu: '0'
    memory: '0'
  limits:
    cpu: '0'
    memory: '0'

serviceAccount: # There is no way to set an account per component
  create: true
  name: loki-sa

test:
  enabled: false

lokiCanary:
  enabled: false

sidecar:
  rules: # Rules stored on S3
    enabled: false

gateway:
  service:
    labels:
      prometheus.io/service-monitor: 'false' # nginx exporter unavailable
  resources:
    <<: *no_resources

# Full microservices mode, matching how Tempo and Mimir are deployed in this
# repo. "SimpleScalable" (read/write/backend) is deprecated by the chart and
# slated for removal in Loki 4, so it's not a viable long-term choice here.
deploymentMode: Distributed

# The chart's SimpleScalable-mode targets (write/read/backend) default to 3
# replicas regardless of deploymentMode, and the chart's own validation fails
# the render if both these and the Distributed-mode components below are
# left non-zero at the same time. singleBinary already defaults to 0.
write:
  replicas: 0

read:
  replicas: 0

backend:
  replicas: 0

# All Distributed-mode components default to 0 replicas (the chart just
# renders the workloads; it doesn't pick a replica count for you), so every
# component used here needs an explicit count.
ingester:
  replicas: 3
  # Single Kind cluster with no real availability zones, same rationale as
  # ingester.zoneAwareReplication.enabled: false in values-mimir.yaml.
  zoneAwareReplication:
    enabled: false
  resources:
    <<: *no_resources

distributor:
  replicas: 2
  resources:
    <<: *no_resources

querier:
  replicas: 3
  resources:
    <<: *no_resources

queryFrontend:
  replicas: 2
  resources:
    <<: *no_resources

queryScheduler:
  replicas: 2
  resources:
    <<: *no_resources

indexGateway:
  replicas: 2
  resources:
    <<: *no_resources

compactor:
  # Singleton: only one compactor should run retention/compaction at a time.
  replicas: 1
  resources:
    <<: *no_resources

ruler:
  replicas: 2
  resources:
    <<: *no_resources

loki:
  auth_enabled: true
  commonConfig:
    path_prefix: /var/loki
  storage:
    type: s3
    s3:
      endpoint: rustfs-svc.storage.svc:9000
      accessKeyId: remote_user
      secretAccessKey: R3m0t3us3r
      insecure: true
      s3ForcePathStyle: true
    bucketNames:
      chunks: loki-data
      ruler: loki-ruler
  storage_config:
    tsdb_shipper:
      active_index_directory: /var/loki/tsdb-shipper-active
      cache_location: /var/loki/tsdb-shipper-cache
      cache_ttl: 24h
  rulerConfig:
    alertmanager_url: http://monitor-alertmanager.observability.svc:9093
    enable_alertmanager_v2: true
    enable_sharding: true
  schemaConfig:
    configs:
    - from: '2024-04-08'
      store: tsdb
      object_store: s3
      schema: v13
      index:
        period: 24h
        prefix: loki_index_
  limits_config:
    ingestion_rate_mb: 10
    retention_period: 7d # Global Logs TTL
    # Enable structured metadata support (Loki 3.0+)
    allow_structured_metadata: true
    # Maximum size of structured metadata per log line (default: 64KB)
    max_structured_metadata_size: 65536
    # Maximum number of structured metadata entries per log line
    max_structured_metadata_entries_count: 128
    # Add query timeout to prevent long-running queries (must be in limits_config)
    query_timeout: 5m
  ingester:
    max_chunk_age: 1h
  querier:
    query_ingesters_within: 2h
  query_range:
    # Enable result caching for better performance
    results_cache:
      cache:
        embedded_cache:
          enabled: true
          max_size_mb: 100
  compactor:
    working_directory: /var/loki/compactor
    delete_request_store: s3
    retention_enabled: true
    delete_request_cancel_period: 5m
    retention_delete_delay: 5m
  distributor:
    # Enable OTLP ingestion using Loki's default OTLP configuration
    otlp_config: {}

resultsCache:
  allocatedMemory: 512
  resources:
    <<: *no_resources

chunksCache:
  enabled: true
  replicas: 1
  allocatedMemory: 1024
  resources:
    <<: *no_resources

monitoring:
  dashboards:
    enabled: true
    labels:
      release: monitor
  rules:
    enabled: true
    labels:
      release: monitor
  serviceMonitor:
    enabled: true
    labels:
      release: monitor
